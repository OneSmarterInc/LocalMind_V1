# Reverse proxy in front of gunicorn. For TLS, terminate here (or in Caddy)
# and keep X-Forwarded-Proto so Django's SECURE_PROXY_SSL_HEADER sees https.
server {
    listen 80;
    server_name _;
    client_max_body_size 100m;          # must be >= MAX_UPLOAD_MB

    location /static/ { alias /srv/static/; expires 7d; }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI calls can legitimately take a minute or two on CPU.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Django's own admin site (DJANGO_ADMIN_URL). /admin/ is the LocalMind
    # administrator portal and goes to the web client like every other route.
    location /django-admin/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The web client. Django serves the built Expo bundle (WEB_DIST) with
    # index.html as the fallback for client-side routes, so everything else
    # goes to the API container. This used to be `return 404`, which left a
    # Docker Compose install with a working API and no user interface.
    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
