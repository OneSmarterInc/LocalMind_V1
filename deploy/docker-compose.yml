# Single-host production stack. Copy backend/.env.example to deploy/.env and
# set DJANGO_SECRET_KEY, DJANGO_ALLOWED_HOSTS, POSTGRES_PASSWORD and
# INITIAL_USER_PASSWORD at minimum. Then: docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: localmind
      POSTGRES_USER: localmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localmind"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Only needed when AI_PROVIDER=ollama. The default (llamacpp) runs the model
  # inside the api container from backend/models/*.gguf, fully offline.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama:/root/.ollama
    # Uncomment for an NVIDIA GPU (needs the NVIDIA container toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  api:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://localmind:${POSTGRES_PASSWORD}@db:5432/localmind
      AI_PROVIDER: ${AI_PROVIDER:-llamacpp}
      OLLAMA_BASE_URL: http://ollama:11434
      MEDIA_ROOT: /app/media
      WEB_DIST: /app/web
      DJANGO_DEBUG: "false"
      # nginx (the web service) is the one proxy in front of gunicorn.
      TRUSTED_PROXY_COUNT: "1"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
      - ../backend/models:/app/models:ro
      - ../frontend/dist:/app/web:ro
    depends_on:
      db: { condition: service_healthy }

  # Periodic maintenance: requeue documents abandoned by a recycled worker,
  # flush expired JWT blacklist rows and apply the AI monitor's retention.
  # Runs every 15 minutes.
  maintenance:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://localmind:${POSTGRES_PASSWORD}@db:5432/localmind
      OLLAMA_BASE_URL: http://ollama:11434
      MEDIA_ROOT: /app/media
      DJANGO_DEBUG: "false"
      AI_ENABLED: "false"
    volumes:
      - media:/app/media
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          python manage.py requeue_stuck_documents || true
          python manage.py flushexpiredtokens || true
          python manage.py monitor_ai --purge || true
          sleep 900
        done
    depends_on:
      db: { condition: service_healthy }

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/srv/static:ro
    depends_on:
      - api

volumes:
  pgdata:
  ollama:
  media:
  static:
