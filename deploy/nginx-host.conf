# nginx on the EC2 host (not in Docker), in front of the API container.
# Install:  sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/localmind
#           sudo ln -s /etc/nginx/sites-available/localmind /etc/nginx/sites-enabled/
#           sudo rm -f /etc/nginx/sites-enabled/default
#           sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (docs/AWS_EC2_RUNBOOK.md, step 9). certbot adds the https
# server block, the certificate paths and the http-to-https redirect to this
# file itself, and renews the certificate automatically.
#
# Replace localmind.onesmarter.com with your domain.
server {
    listen 80;
    listen [::]:80;
    server_name localmind.onesmarter.com;

    # Must be >= MAX_UPLOAD_MB in deploy/.env
    client_max_body_size 100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI calls and large uploads can take a few minutes on CPU.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
