name: Integrated private library
on:
  push:
    branches: [feature/integrated-private-library]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: integrated-private-library
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AI_ENABLED: 'false'
      AI_MONITOR_MODE: sync
      API_DOCS_ENABLED: 'true'
      DURABLE_JOBS: 'false'
      DJANGO_SECRET_KEY: localmind-ci-only-not-a-deployment-secret
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/integrated-private-library
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover verified source without overwriting other work
        run: |
          mkdir -p /tmp/private-library-checks
          python scripts/materialize_private_library.py --apply 2>&1 | tee /tmp/private-library-checks/materialization.log
          python -m compileall -q backend
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate device-private library, simple book sharing, local model setup and course doubt fallback'
            git push origin HEAD:feature/integrated-private-library
          fi
          git rev-parse HEAD | tee /tmp/private-library-checks/tested-source.txt
          find scripts tests frontend -maxdepth 2 -iname '*private*' -o -iname '*offline*'
      - name: Install backend test dependencies without heavyweight model engines
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('backend/requirements.txt').read_text().splitlines()
          selected = [s for s in lines if s.strip() and not s.lstrip().startswith('#') and not s.startswith(('docling', 'llama-cpp-python'))]
          Path('/tmp/private-library-ci-requirements.txt').write_text('\n'.join(selected)+'\n')
          PY
          python -m pip install -r /tmp/private-library-ci-requirements.txt -r backend/requirements-dev.txt
      - name: Check committed database migrations
        id: migrations
        continue-on-error: true
        run: cd backend && python manage.py makemigrations --check --dry-run 2>&1 | tee /tmp/private-library-checks/migrations.log
      - name: Full Django test suite
        id: django
        continue-on-error: true
        run: cd backend && python manage.py test --verbosity=2 2>&1 | tee /tmp/private-library-checks/django.log
      - name: Lock and install integrated frontend dependencies
        id: install
        continue-on-error: true
        run: |
          cd frontend
          npm install 2>&1 | tee /tmp/private-library-checks/npm-install.log
          cd ..
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Lock dependencies for integrated local AI and book import'
            git push origin HEAD:feature/integrated-private-library
          fi
          git rev-parse HEAD | tee /tmp/private-library-checks/tested-source.txt
          cd frontend
          npm run | tee /tmp/private-library-checks/npm-scripts.log
      - name: Full frontend TypeScript check
        id: types
        continue-on-error: true
        run: cd frontend && npm run typecheck 2>&1 | tee /tmp/private-library-checks/types.log
      - name: Frontend lint
        id: lint
        continue-on-error: true
        run: cd frontend && npm run lint 2>&1 | tee /tmp/private-library-checks/lint.log
      - name: Production web export
        id: web
        continue-on-error: true
        run: cd frontend && npm run export:web 2>&1 | tee /tmp/private-library-checks/web.log
      - name: Existing content and offline contracts
        id: contracts
        continue-on-error: true
        run: |
          python scripts/check_md_alignment.py 2>&1 | tee /tmp/private-library-checks/content-contracts.log
          python scripts/check_offline_study.py 2>&1 | tee /tmp/private-library-checks/offline-contracts.log
      - name: Save integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-library-integration-results
          path: /tmp/private-library-checks/
          retention-days: 14
      - name: Require all checks
        if: always()
        env:
          RESULTS: '${{ steps.migrations.outcome }} ${{ steps.django.outcome }} ${{ steps.install.outcome }} ${{ steps.types.outcome }} ${{ steps.lint.outcome }} ${{ steps.web.outcome }} ${{ steps.contracts.outcome }}'
        run: |
          for result in $RESULTS; do
            if [ "$result" != 'success' ]; then
              echo 'Integration failed or did not complete; inspect individual logs.'
              exit 1
            fi
          done
          echo 'Integration passed. Physical-device inference and native release builds remain separate checks.'
