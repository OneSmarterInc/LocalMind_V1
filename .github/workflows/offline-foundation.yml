name: Offline study integration
on:
  push:
    branches: [feature/offline-study-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-study-integration-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AI_ENABLED: 'false'
      AI_MONITOR_MODE: sync
      API_DOCS_ENABLED: 'true'
      DURABLE_JOBS: 'false'
      DJANGO_SECRET_KEY: localmind-ci-test-only-not-a-deployment-secret
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend test dependencies without model runtimes
        run: |
          mkdir -p /tmp/localmind-checks
          python - <<'PY'
          from pathlib import Path
          lines = Path('backend/requirements.txt').read_text().splitlines()
          selected = [s for s in lines if s.strip() and not s.lstrip().startswith('#') and not s.startswith(('docling', 'llama-cpp-python'))]
          Path('/tmp/localmind-ci-requirements.txt').write_text('\n'.join(selected)+'\n')
          PY
          python -m pip install -r /tmp/localmind-ci-requirements.txt -r backend/requirements-dev.txt
      - name: Check committed database migrations
        id: migrations
        continue-on-error: true
        run: |
          test -f backend/study/migrations/0001_initial.py
          test -f backend/jobs/migrations/0001_initial.py
          cd backend
          python manage.py makemigrations --check --dry-run 2>&1 | tee /tmp/localmind-checks/migrations.log
      - name: Full Django test suite
        id: django
        continue-on-error: true
        run: cd backend && python manage.py test --verbosity=2 2>&1 | tee /tmp/localmind-checks/django.log
      - name: Install classroom frontend dependencies
        id: frontend_install
        continue-on-error: true
        run: cd frontend && npm ci 2>&1 | tee /tmp/localmind-checks/frontend-install.log
      - name: Full classroom TypeScript check
        id: frontend_types
        continue-on-error: true
        run: cd frontend && npm run typecheck 2>&1 | tee /tmp/localmind-checks/frontend-types.log
      - name: Classroom lint
        id: frontend_lint
        continue-on-error: true
        run: cd frontend && npm run lint 2>&1 | tee /tmp/localmind-checks/frontend-lint.log
      - name: Classroom web production export
        id: frontend_build
        continue-on-error: true
        run: cd frontend && npm run export:web 2>&1 | tee /tmp/localmind-checks/frontend-build.log
      - name: Install locked private runtime dependencies
        id: runtime_install
        continue-on-error: true
        run: cd student-runtime && npm ci 2>&1 | tee /tmp/localmind-checks/runtime-install.log
      - name: Full private runtime TypeScript check
        id: runtime_types
        continue-on-error: true
        run: cd student-runtime && npm run typecheck 2>&1 | tee /tmp/localmind-checks/runtime-types.log
      - name: Content integrity, signatures, prompt and draft tests
        id: contracts
        continue-on-error: true
        run: |
          python scripts/check_md_alignment.py 2>&1 | tee /tmp/localmind-checks/content-contracts.log
          python scripts/check_offline_study.py 2>&1 | tee /tmp/localmind-checks/offline-contracts.log
      - name: Ensure checks did not rewrite tracked source
        id: clean
        continue-on-error: true
        run: git diff --exit-code
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-study-integration-results
          path: /tmp/localmind-checks/*.log
          retention-days: 7
      - name: Require every integration check to succeed
        if: always()
        env:
          RESULTS: '${{ steps.migrations.outcome }} ${{ steps.django.outcome }} ${{ steps.frontend_install.outcome }} ${{ steps.frontend_types.outcome }} ${{ steps.frontend_lint.outcome }} ${{ steps.frontend_build.outcome }} ${{ steps.runtime_install.outcome }} ${{ steps.runtime_types.outcome }} ${{ steps.contracts.outcome }} ${{ steps.clean.outcome }}'
        run: |
          for result in $RESULTS; do
            if [ "$result" != 'success' ]; then
              echo 'At least one integration check failed or did not run. See the logs.'
              exit 1
            fi
          done
          echo 'All checks passed. Native builds, real inference quality and actual-phone performance remain separate acceptance gates.'
